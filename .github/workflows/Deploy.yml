name: Build and deploy

# The rendered map PNGs are not committed (DECISIONS.md 13), so CI regenerates all 966 from
# the pinned submodule before building. That takes ~22s and keeps the repo free of 32 MB of
# derived binaries that would grow again on every re-pin.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true # game/ is public, so no deploy token is needed

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet pillow numpy

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci

      # Extractors must reproduce byte-identically from the pinned commit. If they do not,
      # something is reading outside the submodule and the guide is no longer a pure function
      # of the game version -- fail rather than publish it.
      - name: Extract (determinism enforced)
        run: python3 tools/extract/All.py --check-determinism

      - name: Render map images
        run: python3 tools/porymap/Render.py

      - name: Extract sprites
        run: python3 tools/sprites/Extract.py

      - name: Verify coordinate invariants
        run: python3 tools/validate/CheckCoords.py

      # Runs BEFORE the build: it needs no dist/, and the checklist's failure mode is a page
      # that builds and renders perfectly while doing nothing, so a green build proves nothing
      # about it. Six silent shapes so far -- see the file's header and DECISIONS.md 48, 49.
      - name: Check the checklist against every markdown shape
        run: node tools/qa/Checklist.mjs

      - run: npx astro build

      # AFTER the build, so it indexes the HTML that shipped, and BEFORE the checks below, so
      # the artifact that uploads is the one that was link-checked. It writes only
      # dist/pagefind/ -- no HTML -- so it adds link targets and no pages.
      - name: Build the search index
        run: npx pagefind

      # AFTER the build, because half of what it checks is a property of the emitted HTML:
      # a step whose <li> lost its data-step still shows a number (the CSS counter's) while
      # the map's pin script skips it, and from there the badges and the pins are numbering
      # two different lists. The other half reads content/ and needs no build at all.
      - name: "Check chapters against the sections: contract"
        run: node tools/qa/Chapters.mjs

      - name: Check for broken internal links
        run: node tools/qa/Links.mjs

      # Needs a browser, unlike every other checker here: the properties it asserts --
      # the sticky banner's height, whether the document scrolls sideways -- are facts
      # of layout that only exist once something has actually laid the page out.
      #
      # The browser is ~170MB and it does not change between deploys, so it is cached on
      # the lockfile: the resolved playwright version lives there, so the key moves when
      # and only when the browser build would. Without this every push to main pulled the
      # bundle again, which is slow and, worse, puts a Playwright CDN blip on the critical
      # path of an unrelated deploy.
      - name: Cache the Playwright browser bundle
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-playwright-

      # Still runs on a cache hit, and must: the download is only half the job, and the
      # apt system libraries --with-deps installs live outside the cached path. On a hit
      # it finds the browser present and only settles the system deps.
      - name: Install Chromium for the chrome guard
        run: npx playwright install --with-deps chromium

      # AFTER the build, because it measures the emitted pages. Guards the two things a
      # CSS edit breaks invisibly: a sticky header that grows until a phone has no room
      # left, and a nav that starts setting the document's scroll width again.
      - name: Check the banner's geometry
        run: node tools/qa/Chrome.mjs

      # Runs AFTER the build, and it is the one check that must read dist/ rather than compile
      # markdown itself: it compares the shipped keys against a frozen literal, which is the only
      # comparison a markdown-processor upgrade cannot pass by moving both sides of it. A failure
      # here means readers' stored ticks are about to be orphaned -- see DECISIONS.md 51.
      - name: Check the checklist keys readers' ticks are stored under
        run: node tools/qa/Keys.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist/
          retention-days: 7

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: dist

      - name: Publish to dev.jdayers.com/pkmn-world
        env:
          SSHPASS: ${{ secrets.JDAYERS_SSH_PASSWORD }}
        run: |
          if [ -z "$SSHPASS" ]; then
            echo "::error::Set the JDAYERS_SSH_PASSWORD repository secret before this can deploy."
            exit 1
          fi
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass rsync
          # The host allows password auth only and blocks the SFTP subsystem, so rsync has to
          # run over plain ssh with pubkey auth explicitly disabled.
          SSH="ssh -o StrictHostKeyChecking=no -o PreferredAuthentications=password -o PubkeyAuthentication=no"
          sshpass -e rsync -az --delete -e "$SSH" \
            dist/ johnayers@johndayers.com:/home/johnayers/dev.jdayers.com/pkmn-world/
